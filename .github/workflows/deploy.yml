name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate tsoa routes
        run: npx tsoa spec-and-routes -c tsoa.config.json

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/test"
          REDIS_URL: "redis://localhost:6379"
          JWT_ACCESS_SECRET: "ci-test-access-secret"
          JWT_REFRESH_SECRET: "ci-test-refresh-secret"

      - name: Build
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/TalkQQuest-backend
            git pull origin main
            npm ci
            npx prisma generate
            npm run build
            pm2 restart talkquest
